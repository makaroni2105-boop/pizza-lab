# Pizza-Lab — Cloudflare Workers / D1 (OpenNext for Cloudflare)
# NALIPO 予約システムとは独立（database_name / binding は pizza_lab 専用）

name = "pizza-lab"
# preview_urls = false — Preview / Version URL を無効（営業 Worker 保護）
preview_urls = false
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "pizza-lab"

# D1 — pizza_lab_db のみ（NALIPO nalipo-db とは別 UUID）
[[d1_databases]]
binding = "DB"
database_name = "pizza_lab_db"
database_id = "06fd466a-3878-4e89-b3d7-2d680bfba17f"
migrations_dir = "migrations"

# staging（営業用 /daily）— D1 なし。deploy は wrangler.staging.toml のみ（--env staging は使わない）
# 理由: トップレベル [[d1_databases]] が [env.staging] に継承されるため
# 参照: docs/deploy/staging-nalipo-daily-go-live.md
