# Pizza-Lab — Cloudflare Workers / D1 (OpenNext for Cloudflare)
# NALIPO 予約システムとは独立（database_name / binding は pizza_lab 専用）

name = "pizza-lab"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "pizza-lab"

# D1 — pizza_lab_db のみ（NALIPO nalipo-db とは別 UUID）
[[d1_databases]]
binding = "DB"
database_name = "pizza_lab_db"
database_id = "06fd466a-3878-4e89-b3d7-2d680bfba17f"
migrations_dir = "migrations"

# staging Worker（Phase 6e — deploy:staging 用。まだ deploy 未実行）
[env.staging]
name = "pizza-lab-staging"

[[env.staging.services]]
binding = "WORKER_SELF_REFERENCE"
service = "pizza-lab-staging"
